<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090d"><title>Aura Browser</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--panel:#12121a;--panel2:#191923;--line:#292936;--muted:#8b8b9d;--text:#f4f2ff;--violet:#a78bfa;--cyan:#67e8f9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,Roboto,"Segoe UI",sans-serif}body{overflow:hidden;background:radial-gradient(ellipse at 50% -15%,#292044 0,transparent 48%),var(--bg)}
.app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);max-width:760px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 22px}.brand{display:flex;align-items:center;gap:11px}.mark{width:38px;height:38px;border-radius:14px;background:linear-gradient(145deg,#c4b5fd,#7c3aed 62%,#312e81);display:grid;place-items:center;box-shadow:0 8px 28px #7c3aed44;color:white;font-size:20px;font-weight:900}.brandname{font-size:21px;font-weight:800;letter-spacing:2.8px}.sub{font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:2px}.topbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:14px;background:#ffffff08;color:#ddd8f2;font-size:18px}
.hero{margin:auto 0 22px;text-align:center}.orb{width:82px;height:82px;border-radius:29px;margin:0 auto 23px;background:radial-gradient(circle at 35% 25%,#e9d5ff,#8b5cf6 48%,#312e81 100%);box-shadow:0 0 70px #8b5cf633;display:grid;place-items:center;font-size:38px}.hello{font-size:28px;font-weight:750;letter-spacing:-.7px}.tagline{font-size:13px;color:var(--muted);margin-top:9px}
.search{display:flex;align-items:center;gap:10px;background:#171720;border:1px solid #393447;border-radius:20px;padding:7px 8px 7px 16px;margin:0 0 26px;box-shadow:0 12px 40px #0005}.search .glass{color:var(--violet);font-size:20px}.search input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:15px;padding:12px 0}.search input::placeholder{color:#777789}.go{height:42px;width:44px;border:0;border-radius:14px;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:white;font-size:20px}
.section{display:flex;justify-content:space-between;align-items:center;margin:0 2px 13px}.section strong{font-size:13px;letter-spacing:.7px}.section span{font-size:11px;color:var(--muted)}.sites{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}.site{border:1px solid var(--line);background:linear-gradient(145deg,#181821,#111118);border-radius:18px;padding:15px 4px 12px;text-align:center;color:var(--text);text-decoration:none}.site .ico{width:37px;height:37px;border-radius:13px;margin:0 auto 9px;display:grid;place-items:center;background:#28233a;color:#c4b5fd;font-weight:800;font-size:16px}.site small{font-size:10px;color:#c5c2d3}
.bottom{display:flex;justify-content:space-around;border:1px solid var(--line);background:#111119eF;border-radius:20px;padding:12px 4px;margin-top:auto;margin-bottom:12px;backdrop-filter:blur(20px)}.nav{border:0;background:transparent;color:#89899b;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-width:54px}.nav b{font-size:19px;font-weight:500}.nav.active{color:#c4b5fd}
.note{text-align:center;color:#656578;font-size:10px;margin:0 0 10px}
#browser{display:none;position:fixed;inset:0;background:var(--bg);z-index:5;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.bar{padding:8px 12px;display:flex;gap:8px;background:#111119;border-bottom:1px solid var(--line)}.bar button{border:0;background:#242431;color:#ddd;border-radius:12px;min-width:40px;height:42px;font-size:17px}.bar input{flex:1;min-width:0;border:1px solid #343443;background:#1b1b26;color:white;border-radius:13px;padding:0 12px;font-size:13px;outline:none}.frame{border:0;flex:1;width:100%;background:white}.browserbottom{display:flex;justify-content:space-around;background:#111119;padding:9px 0}.browserbottom button{background:none;border:0;color:#c4b5fd;font-size:20px;padding:5px 15px}
@media(min-height:800px){.hero{margin-bottom:30px}.orb{width:92px;height:92px}}
</style></head>
<body><main class="app" id="home">
<header class="top"><div class="brand"><div class="mark">A</div><div><div class="brandname">AURA</div><div class="sub">BROWSE BEYOND</div></div></div><button class="topbtn" onclick="toast('Настройки появятся в следующей сборке')" aria-label="Настройки">⚙</button></header>
<section class="hero"><div class="orb">✦</div><div class="hello">Твой интернет. Твои правила.</div><div class="tagline">Быстрый старт без лишнего шума.</div></section>
<form class="search" onsubmit="openSearch(event)"><span class="glass">⌕</span><input id="query" autocomplete="off" placeholder="Поиск или адрес сайта" aria-label="Поиск или адрес сайта"><button class="go" aria-label="Открыть">→</button></form>
<div class="section"><strong>БЫСТРЫЙ ДОСТУП</strong><span>избранное</span></div>
<div class="sites"><a class="site" href="#" onclick="visit('https://www.google.com');return false"><div class="ico">G</div><small>Google</small></a><a class="site" href="#" onclick="visit('https://youtube.com');return false"><div class="ico">▶</div><small>YouTube</small></a><a class="site" href="#" onclick="visit('https://wikipedia.org');return false"><div class="ico">W</div><small>Wikipedia</small></a><a class="site" href="#" onclick="visit('https://github.com');return false"><div class="ico">⌘</div><small>GitHub</small></a></div>
<p class="note">AURA · лёгкий интерфейс · системный Chromium WebView</p>
<nav class="bottom"><button class="nav active"><b>⌂</b>Главная</button><button class="nav" onclick="toast('История — в следующем этапе')"><b>◷</b>История</button><button class="nav" onclick="toast('Закладки — в следующем этапе')"><b>☆</b>Закладки</button><button class="nav" onclick="toast('Вкладки — в следующем этапе')"><b>▢</b>Вкладки</button></nav>
</main>
<section id="browser"><div class="bar"><button onclick="goBack()">‹</button><input id="address" value="https://www.google.com" onkeydown="if(event.key==='Enter')navigate()"><button onclick="navigate()">↵</button><button onclick="showHome()">⌂</button></div><iframe class="frame" id="page" referrerpolicy="no-referrer"></iframe><div class="browserbottom"><button onclick="goBack()">‹</button><button onclick="navigate()">↻</button><button onclick="showHome()">⌂</button><button onclick="toast('Менеджер вкладок появится позже')">▢</button></div></section>
<script>
const home=document.getElementById('home'),browser=document.getElementById('browser'),page=document.getElementById('page'),address=document.getElementById('address');let lastUrl='https://www.google.com';
function normalize(q){q=q.trim();if(!q)return 'https://www.google.com';if(/^https?:\/\//i.test(q))return q;if(/^[\w-]+\.[a-z]{2,}([/:?#].*)?$/i.test(q))return 'https://'+q;return 'https://www.google.com/search?q='+encodeURIComponent(q)}
function openSearch(e){e.preventDefault();visit(normalize(document.getElementById('query').value))}
function visit(url){lastUrl=url;address.value=url;home.style.display='none';browser.style.display='flex';page.src=url}
function navigate(){visit(normalize(address.value))}function showHome(){browser.style.display='none';home.style.display='flex'}function goBack(){try{page.contentWindow.history.back()}catch(e){}}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';Object.assign(t.style,{position:'fixed',bottom:'95px',left:'20px',right:'20px',padding:'13px',borderRadius:'14px',background:'#292438',color:'white',textAlign:'center',zIndex:20,fontSize:'13px'});document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',1900)}
</script></body></html>
