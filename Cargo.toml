[package]
name = "aura_browser"
version = "0.1.0"
edition = "2021"
authors = ["Aura Browser"]
description = "Aura Browser — lightweight Rust-first Android browser shell"
license = "MIT OR Apache-2.0"

[lib]
name = "aura_browser"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
android-activity = { version = "0.6", features = ["native-activity"] }
tao = { version = "0.34", features = ["rwh_06"] }
wry = { version = "0.57", features = ["os-webview"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tao = { version = "0.34", features = ["rwh_06"] }
wry = { version = "0.57", features = ["os-webview"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
